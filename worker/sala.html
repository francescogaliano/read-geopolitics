<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sala di controllo</title><meta name="theme-color" content="#111417"><link rel="icon" href="/ig/panel.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5F1;--fg:#1D2329;--mut:#66707A;--line:#DEDBD3;--acc:#2F5D8A;--ok:#2E8B57;--warn:#B7791F;--bad:#C0392B;--wait:#A3ABB2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111417;--fg:#E6E9EC;--mut:#8D979F;--line:#262C31;--acc:#7FA9D6;--ok:#5FBF8A;--warn:#E0A84A;--bad:#E57368;--wait:#5C666E}}
:root[data-theme="dark"]{--bg:#111417;--fg:#E6E9EC;--mut:#8D979F;--line:#262C31;--acc:#7FA9D6;--ok:#5FBF8A;--warn:#E0A84A;--bad:#E57368;--wait:#5C666E}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.5 Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
.mono{font:500 11.5px/1.4 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.top a,.top button{all:unset;cursor:pointer;min-height:44px;display:flex;align-items:center}
.proj{font-weight:600;gap:6px}.proj span{color:var(--mut);font-weight:400}
.plist{display:none;border-bottom:1px solid var(--line)}.plist.open{display:block}
.prow{display:flex;gap:10px;align-items:center;min-height:48px;border-top:1px solid var(--line);cursor:pointer}
.prow .s{margin-left:auto;color:var(--mut);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;background:var(--c,var(--wait))}
.ok{--c:var(--ok)}.warn{--c:var(--warn)}.bad{--c:var(--bad)}.wait{--c:var(--wait)}.run{--c:var(--acc)}
.run .dot,.dot.run{animation:p 1.4s infinite}@keyframes p{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.dot{animation:none!important}}
.light{padding:28px 0 22px;text-align:center;border-bottom:1px solid var(--line)}
.lamp{width:56px;height:56px;border-radius:50%;background:var(--c);margin:0 auto 14px;box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 18%,transparent)}
.light h1{margin:0;font:600 28px/1.2 "Source Serif 4",Georgia,serif}
.light p{margin:8px auto 0;color:var(--mut);max-width:46ch}
h2{margin:0;padding:26px 0 10px;font:600 20px/1.3 "Source Serif 4",Georgia,serif;border-bottom:1px solid var(--line)}
h2 small{display:block;font:500 11.5px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.todo{border-bottom:1px solid var(--line);border-left:4px solid var(--c);padding:14px 0 14px 14px}
.todo b{font-size:17px;display:block}.todo p{margin:4px 0 10px;color:var(--mut)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;min-height:48px;line-height:48px;font-weight:600;background:var(--fg);color:var(--bg);border-radius:8px}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line);margin-top:8px}
.btn.ask{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.res{margin-top:10px;font-size:14.5px;border-left:2px solid var(--acc);padding-left:10px}
.allok{padding:14px 0;color:var(--mut);border-bottom:1px solid var(--line)}
.ev{display:grid;grid-template-columns:52px 16px minmax(0,1fr);gap:0 10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ev .h{font:500 14px "JetBrains Mono",monospace;font-variant-numeric:tabular-nums;color:var(--mut)}
.ev b{font-weight:600}.ev .arr{color:var(--mut)}
.ev.now{border-bottom:2px solid var(--acc)}.ev.now .h,.ev.now b{color:var(--acc)}
.ev.later{opacity:.6}
.board{width:100%;border-collapse:collapse;font-size:15px;table-layout:fixed}.board th:nth-child(2),.board th:nth-child(3){width:86px}.board th:nth-child(4){width:72px}.board td{overflow-wrap:anywhere}
.board th{font:500 11px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:10px 6px 8px 0;border-bottom:1px solid var(--line)}
.board td{padding:10px 6px 10px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
.board td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.board .nm{display:flex;gap:8px;align-items:baseline}.board .nm small{display:block;color:var(--mut);font-size:13px}
.rl{all:unset;cursor:pointer;color:var(--acc);font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.rl.ask{color:var(--bad)}.rl:disabled{color:var(--mut);cursor:default}
.board tr.rr{cursor:pointer}.board tr.det td{padding:4px 0 16px 18px;color:var(--fg)}.dl{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:6px 12px;font-size:14.5px}.dl dt{color:var(--mut)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}.dl .qq{color:var(--mut)}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 0;font-size:14px;color:var(--mut)}
.legend span{display:flex;gap:6px;align-items:center}
details{border-bottom:1px solid var(--line)}summary{cursor:pointer;padding:14px 0;min-height:44px}
details p{margin:0 0 14px;color:var(--mut);max-width:68ch}
label{display:block;margin:8px 0;font-size:14px;color:var(--mut)}
input{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);font:inherit}
.empty{padding:40px 0;text-align:center;color:var(--mut)}
</style></head><body><div class="wrap">
<div class="top"><button class="proj" id="projBtn">…</button><span style="display:flex;gap:18px"><a class="mono" href="/ig/panel">pannello</a><button class="mono" id="rf">aggiorna</button></span></div>
<div class="plist" id="plist"></div>
<div id="main"><div class="empty">Carico…</div></div>
</div>
<script>
var S=null,PR=null;
var $=function(s){return document.querySelector(s)};
function e(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hm(iso){if(!iso)return "";var d=new Date(iso);var o=new Intl.DateTimeFormat("it-IT",{timeZone:"Europe/Rome",hour:"2-digit",minute:"2-digit"}).format(d);var day=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Rome"}).format(d);if(day===S.oggi)return o;var w=new Intl.DateTimeFormat("it-IT",{timeZone:"Europe/Rome",weekday:"short"}).format(d);return w+" "+o}
function api(o){return fetch("/ig/api",{method:"POST",body:JSON.stringify(o)}).then(function(r){if(r.status===401){location.href="/ig/panel";return {}}return r.json()})}
function load(){$("#rf").textContent="…";api({action:"sala_stato"}).then(function(j){$("#rf").textContent="aggiorna";if(!j||!j.ok){$("#main").innerHTML='<div class="empty">Non riesco a leggere lo stato. Riprova tra poco.</div>';return}S=j;if(!PR||!S.progetti.some(function(p){return p.id===PR}))PR=S.progetti[0].id;render()}).catch(function(){$("#rf").textContent="aggiorna";$("#main").innerHTML='<div class="empty">Connessione assente.</div>'})}
var OPEN={};
var GG=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
function quando(c){if(!c)return "solo a richiesta";var tz=/^CRON_TZ=/.test(c);var f=c.replace(/^CRON_TZ=\S+\s+/,"").trim().split(/\s+/);if(f.length<5)return c;var m=f[0],hh=f[1],dw=f[4];var mm=("0"+m).slice(-2),ore;
 if(/^\d+-\d+$/.test(hh)){var a=hh.split("-");ore="ogni ora dalle "+a[0]+":"+mm+" alle "+a[1]+":"+mm}else if(hh==="*")ore="ogni ora al minuto "+m;else ore="alle "+hh.split(",").map(function(x){return x+":"+mm}).join(", ");
 var g=dw==="*"?"ogni giorno":dw.split(",").map(function(x){if(/^\d-\d$/.test(x)){var b=x.split("-");return GG[+b[0]%7]+"-"+GG[+b[1]%7]}return GG[+x%7]}).join(", ");
 return g+", "+ore+(tz?"":" (ora UTC)")}
function dur(s){return s==null?"—":s<90?Math.round(s)+" s":Math.round(s/60)+" min"}
function det(r){var i=r.info||{};var x='<dl class="dl"><dt>Quando</dt><dd>'+e(quando(r.cron))+'</dd><dt>Durata tipica</dt><dd>'+dur(r.durata)+(r.giri?' <span class="qq">(su '+r.giri+' giri visti)</span>':'')+'</dd><dt>Ultimi 7 giorni</dt><dd>'+(r.sett?(r.sett.ok+' andati bene'+(r.sett.ko?', '+r.sett.ko+' con problemi':'')):'—')+'</dd>';
 if(r.info){x+='<dt>Approvazione</dt><dd>'+(i.auto?'automatica':'<b>chiede il permesso</b> <span class="qq">se deve scrivere qualcosa può bloccarsi</span>')+'</dd><dt>Modello</dt><dd>'+e(i.modello||"predefinito")+'</dd><dt>Connettori</dt><dd>'+i.conn+'</dd><dt>Istruzioni</dt><dd><span class="qq">«'+e(i.prompt)+(i.plen>i.prompt.length?'…':'')+'»</span> '+(i.plen?Math.round(i.plen/100)/10+' mila caratteri':'')+'</dd>'}
 return x+'<dt>Id</dt><dd><span class="qq">'+e(r.id)+'</span></dd></dl>'}
var TIT={ok:"Tutto ok",warn:"Quasi tutto ok",bad:"Qualcosa non va",wait:"Nessun dato ancora"};
function render(){
 var p=S.progetti.filter(function(x){return x.id===PR})[0];
 $("#projBtn").innerHTML='<span class="dot '+p.luce+'"></span>'+e(p.nome)+' <span>▾</span>';
 $("#plist").innerHTML=S.progetti.map(function(x){var n=x.problemi.length+x.dafare.length;return '<div class="prow" data-p="'+x.id+'"><span class="dot '+x.luce+'"></span><b>'+e(x.nome)+'</b><span class="s">'+(x.luce==="wait"?"nessun dato":n?n+(n>1?" cose":" cosa"):"tutto ok")+'</span></div>'}).join("");
 var h="",luce=S.silente?"bad":p.luce;
 var nb=p.problemi.length,nd=p.dafare.length,frase;
 if(S.silente)frase=S.rapporto?"Il guardiano non manda notizie dalle "+hm(S.rapporto)+": quello che vedi qui potrebbe essere vecchio.":"Il guardiano non ha ancora mandato il primo rapporto.";
 else if(!nb&&!nd)frase="Tutte le routine sono andate bene e non c'è niente che aspetta te.";
 else frase=[nb?(nb===1?"Una routine ha un problema":nb+" routine hanno un problema"):"",nd?(nd===1?"una cosa aspetta te":nd+" cose aspettano te"):""].filter(Boolean).join(", ")+".";
 frase=frase.charAt(0).toUpperCase()+frase.slice(1);
 if(S.errore)frase='Ultimo rapporto scartato: '+S.errore+'.';
 h+='<section class="light '+luce+'"><div class="lamp"></div><h1>'+(S.silente?"Guardiano muto":TIT[luce])+'</h1><p>'+e(frase)+'</p><div class="mono" style="margin-top:12px">'+(S.rapporto?"ultimo controllo "+hm(S.rapporto):"nessun controllo ancora")+'</div></section>';
 h+='<h2>Cosa devi fare<small>solo ciò che richiede te</small></h2>';
 p.problemi.forEach(function(x){h+='<div class="todo '+x.e+'"><b>'+e(x.nome)+': '+e(x.msg)+'</b><p>'+(x.e==="bad"?"Rilanciala: riparte da capo.":"È andata, ma in modo strano: controlla che abbia fatto tutto.")+'</p><button class="btn" data-rl="'+x.id+'">Rilancia</button><button class="btn sec" data-ig="'+e(x.key)+'">Va bene così</button><div class="res" hidden></div></div>'});
 p.dafare.forEach(function(x){h+='<div class="todo warn"><b>'+e(x.testo)+'</b><p>'+e(x.perche)+'</p><a class="btn" href="'+e(x.link)+'">Apri il pannello</a><button class="btn sec" data-ig="'+e(x.key)+'">Non serve, nascondi</button><div class="res" hidden></div></div>'});
 if(!nb&&!nd)h+='<div class="allok">Niente. Se una routine si rompe compare qui, con il pulsante per rilanciarla, e ti arriva un avviso su Telegram.</div>';
 h+='<h2>La giornata<small>oggi, in ordine di orario</small></h2>';
 var now=new Date().toISOString(),placed=false,ev=p.giornata;
 if(!ev.length)h+='<div class="allok">Nessun giro registrato oggi.</div>';
 ev.forEach(function(r){
  if(!placed&&r.fired>now){placed=true;h+='<div class="ev now"><span class="h">'+hm(now)+'</span><span class="dot" style="background:var(--acc)"></span><span><b>Adesso</b></span></div>'}
  var c,t;
  if(r.status==="PREVISTO"){c="wait later";t="in programma"}
  else if(r.status==="MANCATO"){c="bad";t="→ non è partita"}
  else if(/FAIL|ERROR|CANCEL/.test(r.status)){c="bad";t="→ si è rotta"+(r.fail?" ("+r.fail+")":"")}
  else if(!r.finished){if(Date.now()-Date.parse(r.fired)>5400000){c="bad";t="→ ferma, non ha finito"}else{c="run";t="→ in corso"}}
  else{c="ok";t="→ finita in "+(r.dur<90?Math.round(r.dur)+" s":Math.round(r.dur/60)+" min")}
  h+='<div class="ev '+c+'"><span class="h">'+hm(r.fired)+'</span><span class="dot"></span><span><b>'+e(r.nome)+'</b> <span class="arr">'+e(t)+'</span></span></div>'});
 if(ev.length&&!placed)h+='<div class="ev now"><span class="h">'+hm(now)+'</span><span class="dot" style="background:var(--acc)"></span><span><b>Adesso</b></span></div>';
 h+='<div class="legend"><span><span class="dot ok"></span>andata bene</span><span><span class="dot warn"></span>con un intoppo</span><span><span class="dot bad"></span>si è rotta</span><span><span class="dot run"></span>in corso</span><span><span class="dot wait"></span>deve partire</span></div>';
 h+='<h2>Le routine<small>una riga per routine · tocca il nome per i dettagli</small></h2><table class="board"><thead><tr><th>Routine</th><th>Ultimo</th><th>Prossimo</th><th></th></tr></thead><tbody>';
 p.routine.forEach(function(r){h+='<tr class="rr" data-d="'+r.id+'"><td><div class="nm '+r.e+'"><span class="dot"></span><span>'+e(r.nome)+(r.msg?'<small>'+e(r.msg)+'</small>':'')+'</span></div></td><td class="n">'+(r.ultimo?hm(r.ultimo):"—")+'</td><td class="n">'+(r.prossimo?hm(r.prossimo):(r.richiesta?"a richiesta":"—"))+'</td><td><button class="rl" data-rl="'+r.id+'"'+(r.in_coda?" disabled":"")+'>'+(r.in_coda?"in coda":"Rilancia")+'</button></td></tr>'+(OPEN[r.id]?'<tr class="det"><td colspan="4">'+det(r)+'</td></tr>':'')});
 h+='</tbody></table><div class="res" id="bres" hidden></div>';
 h+='<details><summary class="mono">Come funziona</summary><p>Ogni ora il guardiano legge l’elenco delle routine con i loro ultimi giri e lo manda qui. Il Worker capisce se una routine si è rotta, non è partita, è ferma o è finita troppo presto rispetto al solito, e ti avvisa su Telegram una volta sola per problema. «Rilancia» mette la routine in coda: il guardiano la fa ripartire al suo prossimo giro (ogni ora, al minuto 7).</p>';
 h+='</details>';
 $("#main").innerHTML=h;
}
document.addEventListener("click",function(ev){
 var pr=ev.target.closest(".prow");if(pr){PR=pr.dataset.p;$("#plist").classList.remove("open");render();return}
 if(ev.target.closest("#projBtn")){$("#plist").classList.toggle("open");return}
 if(ev.target.closest("#rf")){load();return}
 var b=ev.target.closest("[data-rl]");
 if(!b){var rr=ev.target.closest("tr.rr");if(rr){OPEN[rr.dataset.d]=!OPEN[rr.dataset.d];render();return}}
 if(b){if(!b.classList.contains("ask")){b.classList.add("ask");b.dataset.t=b.textContent;b.textContent="Tocca di nuovo per rilanciare";setTimeout(function(){if(b.classList.contains("ask")){b.classList.remove("ask");b.textContent=b.dataset.t}},4000);return}
  b.classList.remove("ask");b.disabled=true;b.textContent="…";
  api({action:"sala_rilancia",id:b.dataset.rl}).then(function(j){var r=b.parentElement.querySelector(".res")||$("#bres");r.hidden=false;r.textContent=j&&j.ok?("In coda. Guardiano: "+j.fire+"."):("Non riesco: "+((j&&j.error)||"errore"));b.textContent="in coda"});return}
 var g=ev.target.closest("[data-ig]");
 if(g){g.disabled=true;api({action:"sala_ignora",key:g.dataset.ig}).then(function(){load()});return}
 if(ev.target.closest("#gsv")){api({action:"sala_guard",id:$("#gid").value,token:$("#gtk").value}).then(function(j){var r=$("#gres");r.hidden=false;r.textContent=j&&j.ok?"Collegato.":(j&&j.error)||"Errore";if(j&&j.ok)load()})}
});
load();setInterval(function(){if(!document.hidden)load()},120000);
</script></body></html>
