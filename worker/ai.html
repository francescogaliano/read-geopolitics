<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<link rel="icon" href="/ig/panel.svg?v=2" type="image/svg+xml">
<title>Intelligenza artificiale · Pannello</title>
<style>
:root{color-scheme:dark;--bg:#0B1118;--fg:#E8EDF2;--mut:#7F909E;--line:#1F2B35;--acc:#86B4EA;--up:#5FCB8C;--dn:#EF6F62;--amb:#E8A33D;--t1:#A796F5;--t2:#4FC3B5;--t3:#E07FB0;--t4:#6FA8DC;--t5:#E8A33D;--t6:#9CCC65}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:var(--acc)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h1{margin:0;font:600 23px/1.2 "Source Serif 4",Georgia,serif}
.mono{font:11px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:12px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;padding:12px 0 10px;color:var(--mut);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;min-height:22px}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--acc)}
.lead{color:var(--mut);margin:12px 0 0;font-size:14px}
.frase{border-left:3px solid var(--amb);padding:4px 0 4px 12px;margin:16px 0 0;font:600 18px/1.35 "Source Serif 4",Georgia,serif}
.sec{margin:30px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.big{font:600 52px/1 "Source Serif 4",Georgia,serif;color:var(--amb);margin-top:6px}.bigsub{color:var(--mut);font-size:14px;margin-top:6px}
.ins{border-top:1px solid var(--line);padding:16px 0}.ins:last-child{border-bottom:1px solid var(--line)}
.ins h2,.h2{margin:4px 0 0;font:600 18px/1.3 "Source Serif 4",Georgia,serif}
.lab{font:600 11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
p{margin:8px 0 0}.k{color:var(--mut);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:block;margin:12px 0 2px}
.dots{margin-top:6px;font-size:14px}.dots div{padding:6px 0 6px 14px;border-left:2px solid var(--line);position:relative}.dots div:before{content:"";position:absolute;left:-5px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.ob{margin-top:12px;padding-left:12px;border-left:3px solid var(--acc)}.ob .k{color:var(--acc);margin-top:0}
.f{margin-top:8px;font-size:12.5px;color:var(--acc)}.f a{color:var(--acc)}
.chart{margin-top:12px}.chart svg{width:100%;height:auto;display:block}.cap{font-size:12.5px;color:var(--mut);margin-top:4px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:baseline}
.rows>.row:last-child,.rows>details:last-child{border-bottom:1px solid var(--line)}
.row .n,.n{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.bar{border-left:3px solid var(--t1);padding-left:10px}
.q{padding:12px 0;border-top:1px solid var(--line);font:600 16px/1.35 "Source Serif 4",Georgia,serif}.q span{display:block;font:400 13px/1.4 Inter,system-ui;color:var(--mut);margin-top:4px}
details{border-top:1px solid var(--line)}details>summary{list-style:none;cursor:pointer;padding:13px 0;min-height:44px}details>summary::-webkit-details-marker{display:none}
details[open]>summary{padding-bottom:6px}.in{padding:0 0 16px}
.dir{font:600 15px ui-monospace,monospace}.su{color:var(--up)}.giu{color:var(--dn)}.st{color:var(--mut)}.inc{color:var(--amb)}
.mx{width:100%;border-collapse:collapse;margin-top:6px;font-size:13.5px}.mx th{font:500 10.5px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 6px 8px 0;border-bottom:1px solid var(--line)}
.mx td{padding:10px 6px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}.mx td:first-child{font-weight:600;width:28%}.mx tr{cursor:pointer}.mx .c{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.oriz{border-top:1px solid var(--line);padding:12px 0}.oriz h3{margin:0;font:600 15px/1.3 Inter,system-ui}
.chip{font:600 11px ui-monospace,monospace;letter-spacing:.06em}
.empty{padding:22px 0;color:var(--mut);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:12px}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:8px;border-radius:6px;font:inherit;min-height:40px}
.back{font-size:14px;color:var(--acc);text-decoration:none}
</style></head><body><div class="wrap">
<div class="top"><div><div class="mono"><a class="back" href="/ig/panel">← Pannello</a> · privato</div><h1>Intelligenza artificiale</h1></div><div class="mono" id="agg"></div></div>
<div class="tabs" role="tablist"><button data-v="oggi" aria-selected="true">Oggi</button><button data-v="adozione">Adozione</button><button data-v="tesi">Tesi</button><button data-v="clienti">Clienti</button><button data-v="archivio">Archivio</button></div>
<div id="v"></div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const rich=s=>esc(s).replace(/\*(.+?)\*/g,"<b>$1</b>");
function api(o){return fetch("/ig/api",{method:"POST",body:JSON.stringify(o)}).then(r=>{if(r.status===401){location.href="/ig/panel";throw new Error("401")}return r.json()})}
let D=null,V="oggi";
const COL={t1:"var(--t1)",t2:"var(--t2)",t3:"var(--t3)",t4:"var(--t4)",t5:"var(--t5)",t6:"var(--t6)"};
const tcol=id=>COL["t"+(((parseInt(String(id||"").replace(/\D/g,""))||1)-1)%6+1)];
const DIR={su:["↑","su","si rafforza"],giu:["↓","giu","si indebolisce"],stabile:["→","st","stabile"],incerta:["?","inc","da verificare"]};
const dir=d=>{const x=DIR[d]||DIR.incerta;return `<span class="dir ${x[1]}" title="${x[2]}">${x[0]}</span>`};
const dl=s=>{try{return new Date(s+"T12:00:00Z").toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"})}catch(e){return s}};
const fmt=v=>typeof v==="number"?v.toLocaleString("it-IT",{maximumFractionDigits:2}):esc(v);
const fonti=F=>(F&&F.length)?`<div class="f">Fonti: ${F.map(x=>x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.nome)}</a>`:esc(x.nome)).join(" · ")}</div>`:"";

/* ---- grafici (SVG, larghezza 680, testo grande per il telefono) ---- */
function g_barre(c){const S=c.serie||[],n=S.length;if(!n)return"";const W=680,H=250,top=72,bot=40,mx=Math.max(...S.map(s=>+s.v||0))||1,bw=Math.min(120,(W-60)/n*.62),gap=(W-40)/n;
 return `<svg viewBox="0 0 ${W} ${H}"><text x="16" y="22" fill="#7F909E" font-size="19">${esc(c.titolo||"")}</text>${S.map((s,i)=>{const h=((+s.v||0)/mx)*(H-top-bot),x=20+gap*i+(gap-bw)/2,y=H-bot-h;const col=s.prev?"none":s.evid?"#4FC3B5":"#2A4555";
 return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(2,h)}" fill="${col}" ${s.prev?'stroke="#4FC3B5" stroke-dasharray="6 5" stroke-width="2"':""}/><text x="${x+bw/2}" y="${y-9}" fill="${s.prev?"#4FC3B5":"#E8EDF2"}" font-size="21" font-weight="600" text-anchor="middle">${fmt(s.v)}</text><text x="${x+bw/2}" y="${H-12}" fill="#7F909E" font-size="18" text-anchor="middle">${esc(s.et)}</text>`}).join("")}</svg>`}
function g_orizzontali(c){const S=c.serie||[],n=S.length;if(!n)return"";const W=680,rh=40,H=46+n*rh,L=250,R=W-90,log=!!c.log,vals=S.map(s=>+s.v||0),mx=Math.max(...vals)||1,mn=Math.min(...vals.filter(v=>v>0))||1;
 const sc=v=>log?(Math.log10(v)-Math.log10(mn/2))/(Math.log10(mx)-Math.log10(mn/2)):v/mx;
 return `<svg viewBox="0 0 ${W} ${H}"><text x="16" y="22" fill="#7F909E" font-size="19">${esc(c.titolo||"")}${log?" (scala log.)":""}</text>${S.map((s,i)=>{const y=40+i*rh,w=Math.max(4,sc(+s.v||0)*(R-L));return `<text x="16" y="${y+22}" fill="#E8EDF2" font-size="19">${esc(s.et)}</text><rect x="${L}" y="${y+6}" width="${w}" height="22" fill="${s.evid?"#A796F5":"#5a4f96"}"/><text x="${L+w+8}" y="${y+24}" fill="#E8EDF2" font-size="19">${fmt(s.v)}</text>`}).join("")}</svg>`}
function g_punti(c){const S=(c.serie||[]).filter(s=>s.v!=null);if(!S.length)return"";const W=680,H=170,L=60,R=W-60,vals=S.map(s=>+s.v),mn=Math.min(...vals,...(c.forbice||[])),mx=Math.max(...vals,...(c.forbice||[])),sc=v=>L+(mx===mn?.5:(v-mn)/(mx-mn))*(R-L);
 const fb=c.forbice?`<rect x="${sc(c.forbice[0])}" y="${78}" width="${Math.max(6,sc(c.forbice[1])-sc(c.forbice[0]))}" height="18" rx="3" fill="#24323f"/><text x="${(sc(c.forbice[0])+sc(c.forbice[1]))/2}" y="68" fill="#7F909E" font-size="17" text-anchor="middle">${esc(c.forbice_et||"")}</text>`:"";
 return `<svg viewBox="0 0 ${W} ${H}"><text x="16" y="22" fill="#7F909E" font-size="19">${esc(c.titolo||"")}</text><line x1="${L}" y1="87" x2="${R}" y2="87" stroke="#1F2B35" stroke-width="2"/>${fb}${S.map((s,i)=>{const x=sc(+s.v),up=i%2;return `<circle cx="${x}" cy="87" r="${s.evid?11:9}" fill="${s.evid?"#E8A33D":"#86B4EA"}"/><text x="${x}" y="${up?60:124}" fill="${s.evid?"#E8A33D":"#E8EDF2"}" font-size="20" font-weight="600" text-anchor="middle">${fmt(s.v)}${esc(c.unita||"")}</text><text x="${x}" y="${up?40:146}" fill="#7F909E" font-size="16" text-anchor="middle">${esc(s.et)}</text>`}).join("")}</svg>`}
function g_linea(c){const S=c.serie||[];if(S.length<2)return"";const W=680,H=220,L=50,R=W-30,T=40,B=H-36,vals=S.map(s=>+s.v),mn=Math.min(...vals),mx=Math.max(...vals),X=i=>L+i/(S.length-1)*(R-L),Y=v=>B-(mx===mn?.5:(v-mn)/(mx-mn))*(B-T);
 return `<svg viewBox="0 0 ${W} ${H}"><text x="16" y="22" fill="#7F909E" font-size="19">${esc(c.titolo||"")}</text><polyline points="${S.map((s,i)=>X(i)+","+Y(+s.v)).join(" ")}" fill="none" stroke="#86B4EA" stroke-width="3"/>${S.map((s,i)=>(i===0||i===S.length-1||s.evid)?`<circle cx="${X(i)}" cy="${Y(+s.v)}" r="6" fill="${s.evid?"#E8A33D":"#86B4EA"}"/><text x="${X(i)}" y="${Y(+s.v)-12}" fill="#E8EDF2" font-size="19" text-anchor="middle">${fmt(s.v)}</text><text x="${X(i)}" y="${H-8}" fill="#7F909E" font-size="16" text-anchor="middle">${esc(s.et)}</text>`:"").join("")}</svg>`}
function grafico(c){if(!c)return"";const f={barre:g_barre,orizzontali:g_orizzontali,punti:g_punti,linea:g_linea}[c.tipo];return f?`<div class="chart">${f(c)}${c.nota?`<div class="cap">${rich(c.nota)}</div>`:""}</div>`:""}
/* rete: nodi in cerchio, archi con etichetta (dipendenze di Oggi, intrecci dell'Adozione) */
function rete(N,A,nota){if(!N||!N.length)return"";const n=N.length,W=680,H=n<=4?300:Math.max(460,110+n*52),cx=W/2,cy=H/2,rx=W/2-110,ry=H/2-40,P={};
 N.forEach((x,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;P[x.id]=[cx+rx*Math.cos(a),cy+ry*Math.sin(a)]});
 const tr=(x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,k=Math.min(.45,26/Math.abs(dy/L||1e-6)/L,70/L);return [x1+dx*k,y1+dy*k,x2-dx*k,y2-dy*k]};
 const arc=(A||[]).filter(a=>P[a.da]&&P[a.a]).map(a=>{const[x1,y1,x2,y2]=tr(...P[a.da],...P[a.a]),mx=(x1+x2)/2,my=(y1+y2)/2;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${a.forte?"#E8A33D":"#3a4a58"}" stroke-width="${a.forte?3.5:2}" marker-end="url(#${a.forte?"fo":"fr"})"/>${a.testo&&(a.forte||n<=4)?`<text x="${mx}" y="${my-8}" fill="${a.forte?"#E8A33D":"#7F909E"}" font-size="17" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#0B1118" stroke-width="5">${esc(a.testo)}</text>`:""}`}).join("");
 const nod=N.map(x=>{const[px,py]=P[x.id],w=Math.max(120,String(x.nome).length*11+28);return `<rect x="${px-w/2}" y="${py-22}" width="${w}" height="44" rx="6" fill="#16202a" stroke="${x.evid?"#4FC3B5":"#2f4050"}"/><text x="${px}" y="${py+6}" fill="#E8EDF2" font-size="18" font-weight="600" text-anchor="middle">${esc(x.nome)}</text>`}).join("");
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}"><defs><marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3a4a58"/></marker><marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E8A33D"/></marker></defs>${arc}${nod}</svg>${nota?`<div class="cap">${rich(nota)}</div>`:""}</div>`}

/* ---- Oggi ---- */
function vOggi(){const E=D.edizione;if(!E)return `<p class="lead">Qui ogni mattina: il numero della settimana, tre letture che collegano i fatti (con grafico), domande per la riunione, cosa tocca i tuoi clienti.</p><div class="empty">Nessuna edizione ancora: la prima arriva con la routine del mattino.</div>`;
 const sel=D.edizioni.length>1?`<select id="ed">${D.edizioni.map(e=>`<option value="${e.id}"${e.id===E.id?" selected":""}>${dl(e.id)}</option>`).join("")}</select>`:"";
 let h=`<div class="sec"><span class="mono">${esc(dl(E.id))}</span>${sel}</div>`;
 if(E.frase)h+=`<div class="frase" style="margin-top:0">${rich(E.frase)}</div>`;
 if(E.numero)h+=`<div class="sec"><span class="mono">Il numero della settimana</span><span class="mono">${esc(E.numero.data||"")}</span></div><div class="big">${esc(E.numero.val)}</div><div class="bigsub">${rich(E.numero.testo)}</div>${grafico(E.numero.grafico)}${fonti(E.numero.fonti)}`;
 if((E.letture||[]).length)h+=`<div class="sec"><span class="mono">Letture che collegano i fatti</span><span class="mono">${E.letture.length}</span></div><div>`+E.letture.map(l=>{const tc=l.tesi?tcol(l.tesi.id):"var(--acc)",tt=l.tesi&&(D.tesi.find(t=>t.id===l.tesi.id)||{});
  return `<div class="ins"><span class="lab" style="color:${tc}">${esc(l.tema||"")}</span><h2>${rich(l.titolo)}</h2>${grafico(l.grafico)}${(l.fatti||[]).length?`<span class="k">I fatti, messi in fila</span><div class="dots">${l.fatti.map(f=>`<div>${f.data?`<b>${esc(f.data)}</b> · `:""}${rich(f.testo)}</div>`).join("")}</div>`:""}${l.lettura?`<span class="k">La lettura</span><p>${rich(l.lettura)}</p>`:""}${l.diversa?`<div class="ob"><span class="k">Chi la vede diversamente</span>${rich(l.diversa)}</div>`:""}${l.tesi?`<div class="f" style="color:${tc}">Tesi ${esc(String(l.tesi.id).replace(/\D/g,""))} · ${esc(tt.titolo||"")} → ${esc((DIR[l.tesi.effetto]||DIR.incerta)[2])}</div>`:""}${fonti(l.fonti)}</div>`}).join("")+`</div>`;
 if(E.dipendenze&&E.dipendenze.nodi)h+=`<div class="sec"><span class="mono">Chi dipende da chi</span></div>`+rete(E.dipendenze.nodi,E.dipendenze.archi,E.dipendenze.nota);
 if((E.domande||[]).length)h+=`<div class="sec"><span class="mono">Per la prossima riunione</span><span class="mono">domande che fanno la differenza</span></div>`+E.domande.map((q,i)=>`<div class="q"${i===E.domande.length-1?' style="border-bottom:1px solid var(--line)"':""}>«${esc(q.q)}»<span>${rich(q.perche||"")}</span></div>`).join("");
 if((E.clienti||[]).length)h+=`<div class="sec"><span class="mono">Tocca i tuoi clienti</span></div><div class="rows">`+E.clienti.map(c=>`<div class="row"><span>${rich(c.testo)}<span class="n">${rich(c.perche||"")}${(c.clienti||[]).length?" · "+c.clienti.map(esc).join(", "):""}</span></span><span class="chip" style="color:${tcol(c.tesi)}">${c.tesi?esc(String(c.tesi).toUpperCase()):""}</span></div>`).join("")+`</div>`;
 const T=D.tesi.filter(t=>t.stato!=="contesto");if(T.length)h+=`<div class="sec"><span class="mono">Le tesi</span><span class="mono">direzione · 8 settimane</span></div><div class="rows">`+T.map(t=>`<div class="row"><span class="bar" style="border-color:${tcol(t.id)}">${esc(t.n||String(t.id).replace(/\D/g,""))} · ${esc(t.titolo)}<span class="n">${rich((t.direzione||{}).perche||t.uno||"")}</span></span>${dir((t.direzione||{}).verso)}</div>`).join("")+`</div>`;
 if((E.osservare||[]).length)h+=`<div class="sec"><span class="mono">Da osservare</span></div><div class="rows">`+E.osservare.map(o=>`<div class="row"><span>${rich(o.testo)}${o.perche?`<span class="n">${rich(o.perche)}</span>`:""}</span><span class="mono">${o.data?esc(dl(o.data)):"senza data"}</span></div>`).join("")+`</div>`;
 if(E.log)h+=`<details style="margin-top:24px"><summary class="mono">Come è stata fatta · fonti lette, non raggiungibili, dubbi</summary><div class="in n">${(E.log.consultate||[]).length?`Lette: ${E.log.consultate.map(esc).join(", ")}.`:""} ${(E.log.non_raggiungibili||[]).length?`<br>Non raggiungibili: ${E.log.non_raggiungibili.map(esc).join(", ")}.`:""} ${(E.log.dubbi||[]).length?`<br>Dubbi aperti: ${E.log.dubbi.map(esc).join("; ")}.`:""}</div></details>`;
 return h}

/* ---- Adozione: livelli × orizzonti ---- */
const OR=[["breve","0–12 mesi"],["medio","1–3 anni"],["lungo","3–10 anni"]];
const DCOL={su:"#5FCB8C",giu:"#EF6F62",stabile:"#7F909E",incerta:"#E8A33D"},CONF={alta:1,media:.66,bassa:.33};
const STADI=[["esplora","esplora"],["pilota","pilota"],["produzione","in produzione"],["scala","in scala"]];
const stadio=s=>{const x=STADI.find(t=>t[0]===s);return x?`<span class="chip" style="color:${s==="scala"||s==="produzione"?"var(--up)":s==="pilota"?"var(--amb)":"var(--mut)"}">${x[1].toUpperCase()}</span>`:""};
function cella(x){if(!x)return `<td><span class="c">—</span></td>`;const c=DCOL[x.direzione]||DCOL.incerta,w=Math.round((CONF[x.confidenza]||.5)*100);
 return `<td><div style="height:6px;border-radius:3px;background:#1F2B35;margin:2px 0 6px"><div style="height:6px;border-radius:3px;width:${w}%;background:${c}"></div></div>${dir(x.direzione)} <span class="c" style="display:inline">${esc(x.titolo||"")}</span></td>`}
function imbuto(P){const n={};(P||[]).forEach(p=>{if(p.stadio)n[p.stadio]=(n[p.stadio]||0)+1});const tot=STADI.reduce((a,[k])=>a+(n[k]||0),0);if(tot<2)return"";
 const col={esplora:"#3A4A58",pilota:"#E8A33D",produzione:"#5FCB8C",scala:"#2E9E63"};
 return `<div class="chart"><div class="n" style="margin-bottom:6px">I casi qui sotto, per stadio</div><div style="display:flex;height:14px;border-radius:7px;overflow:hidden">${STADI.filter(([k])=>n[k]).map(([k])=>`<div style="flex:${n[k]};background:${col[k]}"></div>`).join("")}</div><div class="n" style="margin-top:6px">${STADI.filter(([k])=>n[k]).map(([k,l])=>`<span style="color:${col[k]==="#3A4A58"?"var(--mut)":col[k]}">■</span> ${l} ${n[k]}`).join(" · ")}</div></div>`}
function perche(P){if(!(P||[]).length)return"";return `<span class="k">Perché lo diciamo · i casi</span>${imbuto(P)}<div class="rows">${P.map(p=>`<div class="row"><span><b>${esc(p.chi)}</b>${p.settore?` <span class="n" style="display:inline">· ${esc(p.settore)}</span>`:""}<span style="display:block;margin-top:2px">${rich(p.cosa)}</span><span class="n">${p.data?esc(p.data)+" · ":""}${p.misura==="misurato"?'<span style="color:var(--up)">misurato</span>':p.misura?'<span style="color:var(--amb)">dichiarato</span>':""}${p.fonte?" · "+(p.fonte.url?`<a href="${esc(p.fonte.url)}" target="_blank" rel="noopener">${esc(p.fonte.nome)}</a>`:esc(p.fonte.nome)):""}</span></span><span style="text-align:right">${p.dato?`<b style="color:var(--amb);display:block">${esc(p.dato)}</b>`:""}${stadio(p.stadio)}</span></div>`).join("")}</div>`}
function vAdozione(){const A=Object.fromEntries(D.adozione.map(a=>[a.id,a]));const L=D.livelli.filter(([k])=>A[k]);
 let h=`<p class="lead">Dove va l'adozione dell'IA, livello per livello. La barra dice la direzione (verde su, rossa giù, ambra incerta, grigia ferma) e quanto ne siamo sicuri (piena = confidenza alta). Tocca un livello per il perché, con i casi.</p>`;
 if(!L.length)return h+`<div class="empty">La mappa si riempie con la routine della domenica.</div>`;
 h+=`<table class="mx"><thead><tr><th>Livello</th>${OR.map(o=>`<th>${o[0]}<br><span style="text-transform:none;letter-spacing:0">${o[1]}</span></th>`).join("")}</tr></thead><tbody>${L.map(([k,nome])=>{const a=A[k],O=a.orizzonti||{};return `<tr data-l="${k}"><td>${esc(nome)}${a.perche_breve?`<span class="c" style="font-weight:400">${rich(a.perche_breve)}</span>`:""}</td>${OR.map(([o])=>cella(O[o])).join("")}</tr>`}).join("")}</tbody></table>`;
 const K=D.adozione.flatMap(a=>(a.kpi||[]).map(x=>({...x,l:a.id})));
 if(K.length)h+=`<div class="sec"><span class="mono">I numeri che contano</span><span class="mono">ultimo dato</span></div><div class="rows">${K.slice(0,8).map(x=>`<div class="row"><span>${rich(x.testo)}<span class="n">${esc((D.livelli.find(l=>l[0]===x.l)||[])[1]||"")}${x.fonte?" · "+esc(x.fonte):""}</span></span><b style="color:var(--amb);font:600 22px/1 'Source Serif 4',Georgia,serif">${esc(x.val)}</b></div>`).join("")}</div>`;
 const N=L.map(([k,nome])=>({id:k,nome})),AR=[];D.adozione.forEach(a=>(a.intrecci||[]).forEach(i=>AR.push({da:a.id,a:i.verso,testo:i.breve||"",forte:!!i.forte})));
 if(AR.length)h+=`<div class="sec"><span class="mono">Gli intrecci</span><span class="mono">chi spinge chi</span></div>`+rete(N,AR,"Una freccia: un livello che cambia ne muove un altro. In oro, con il meccanismo, gli intrecci più forti adesso; gli altri sono nella scheda di ogni livello.");
 const P=[];D.adozione.forEach(a=>(a.attori||[]).forEach(x=>P.push({...x,livello:(D.livelli.find(l=>l[0]===a.id)||[])[1]})));
 if(P.length)h+=`<div class="sec"><span class="mono">I protagonisti</span><span class="mono">chi decide · ultima mossa</span></div><div class="rows">`+P.sort((a,b)=>String(b.data||"").localeCompare(String(a.data||""))).slice(0,24).map(x=>`<div class="row"><span><b>${esc(x.nome)}</b> · ${esc(x.ruolo||"")}<span class="n">${rich(x.mossa||"")}</span></span><span class="mono">${esc(x.livello||"")}${x.data?"<br>"+esc(x.data):""}</span></div>`).join("")+`</div>`;
 h+=`<div class="sec"><span class="mono">Ogni livello, in profondità</span></div><div class="rows">`+L.map(([k,nome])=>{const a=A[k],O=a.orizzonti||{};return `<details id="lv-${k}"><summary><div class="row" style="border:0;padding:0"><span><b>${esc(nome)}</b><span class="n">${rich(a.sintesi||"")}</span></span><span class="mono">${a.aggiornato?esc(dl(a.aggiornato)):""}</span></div></summary><div class="in">${a.perche?`<div class="frase" style="margin:4px 0 0;font-size:16px">${rich(a.perche)}</div>`:""}${grafico(a.grafico)}${OR.map(([o,lab])=>{const x=O[o];if(!x)return"";return `<div class="oriz"><span class="mono">${o} · ${lab}</span> ${dir(x.direzione)}<h3 style="margin-top:4px">${rich(x.titolo||"")}</h3>${x.dove_siamo?`<span class="k">Dove siamo</span><p>${rich(x.dove_siamo)}</p>`:""}${grafico(x.grafico)}${(x.numeri||[]).length?`<div class="rows" style="margin-top:6px">${x.numeri.map(nm=>`<div class="row"><span>${rich(nm.testo)}<span class="n">${esc(nm.fonte||"")}</span></span><b style="color:var(--amb)">${esc(nm.val)}</b></div>`).join("")}</div>`:""}${perche(x.perche)}${x.dove_va?`<span class="k">Dove va, e perché</span><p>${rich(x.dove_va)}</p>`:""}${(x.chi_decide||[]).length?`<span class="k">Chi decide</span><p>${x.chi_decide.map(rich).join(" · ")}</p>`:""}${(x.decisioni||[]).length?`<span class="k">Decisioni in arrivo</span><div class="dots">${x.decisioni.map(d=>`<div>${d.data?`<b>${esc(d.data)}</b> · `:""}${rich(d.testo)}</div>`).join("")}</div>`:""}${x.letture?`<div class="ob"><span class="k">Due letture</span><p style="margin-top:2px"><b>Sì:</b> ${rich(x.letture.si)}</p><p><b>No:</b> ${rich(x.letture.no)}</p></div>`:""}${x.smentirebbe?`<span class="k">Cosa la smentirebbe</span><p>${rich(x.smentirebbe)}</p>`:""}${x.confidenza?`<div class="n" style="margin-top:8px">Confidenza: ${esc(x.confidenza)}${x.confidenza_perche?" · "+rich(x.confidenza_perche):""}</div>`:""}${fonti(x.fonti)}</div>`}).join("")}${(a.intrecci||[]).length?`<span class="k">Intrecci</span><div class="dots">${a.intrecci.map(i=>`<div><b>→ ${esc((D.livelli.find(l=>l[0]===i.verso)||[,i.verso])[1])}</b> · ${rich(i.testo||i.breve||"")}</div>`).join("")}</div>`:""}</div></details>`}).join("")+`</div>`;
 const AP=D.approf;if(AP.length)h+=`<div class="sec"><span class="mono">Approfondimenti</span></div><div class="rows">`+AP.map(a=>`<details data-ap="${esc(a.id)}"><summary><div class="row" style="border:0;padding:0"><span><b>${esc(a.titolo)}</b><span class="n">${rich(a.sintesi||"")}</span></span><span class="mono">${esc(a.data||"")}</span></div></summary><div class="in" id="ap-${esc(a.id)}">…</div></details>`).join("")+`</div>`;
 return h}

/* ---- Tesi ---- */
function vTesi(){if(!D.tesi.length)return `<div class="empty">Nessuna tesi ancora.</div>`;
 return `<p class="lead">Le tendenze che spiegano dove va l'IA: ognuna con le prove, la direzione delle ultime 8 settimane e cosa la smentirebbe.</p><div class="rows">`+D.tesi.map(t=>{const d=t.direzione||{};return `<details><summary><div class="row" style="border:0;padding:0"><span class="bar" style="border-color:${tcol(t.id)}">${esc(t.n||String(t.id).replace(/\D/g,""))} · ${esc(t.titolo)}<span class="n">${rich(t.uno||"")}</span></span>${dir(d.verso)}</div></summary><div class="in">${d.perche?`<span class="k">Direzione</span><p>${dir(d.verso)} ${rich(d.perche)}</p>`:""}${t.cosa?`<span class="k">Il racconto</span><p>${rich(t.cosa)}</p>`:""}${(t.prove||[]).length?`<span class="k">Le prove</span><div class="rows">${t.prove.map(p=>`<div class="row"><span>${rich(p.testo)}<span class="n">${p.fonte?(p.fonte.url?`<a href="${esc(p.fonte.url)}" target="_blank" rel="noopener">${esc(p.fonte.nome)}</a>`:esc(p.fonte.nome)):""}${p.data?" · "+esc(p.data):""}${p.tier?" · "+esc(p.tier):""}</span></span><b style="color:var(--amb)">${esc(p.val||"")}</b></div>`).join("")}</div>`:""}${t.interpretazione?`<span class="k">Cosa vuol dire per te</span><p>${rich(t.interpretazione)}</p>`:""}${t.domanda?`<span class="k">La domanda da fare</span><p>«${esc(t.domanda)}»</p>`:""}${t.smentirebbe?`<span class="k">Cosa la smentirebbe</span><p>${rich(t.smentirebbe)}</p>`:""}${(t.storia||[]).length?`<span class="k">Come è cambiata</span><div class="dots">${t.storia.slice(-8).reverse().map(s=>`<div><b>${esc(s.data)}</b> · ${dir(s.effetto)} ${rich(s.testo)}</div>`).join("")}</div>`:""}</div></details>`}).join("")+`</div>`}

/* ---- Clienti ---- */
function vClienti(){if(!D.clienti.length)return `<div class="empty">Nessun cliente caricato.</div>`;
 const con=D.clienti.filter(c=>c.tocchi.length),senza=D.clienti.filter(c=>!c.tocchi.length);
 return `<p class="lead">Le novità dell'IA che toccano i tuoi clienti, solo quando c'è un aggancio vero e pubblico.</p>${con.length?`<div class="rows">${con.map(c=>`<details><summary><div class="row" style="border:0;padding:0"><span><b>${esc(c.nome)}</b><span class="n">${esc(c.settore)} · ultimo: ${esc(dl(c.tocchi[0].data))}</span></span><span class="mono">${c.tocchi.length}</span></div></summary><div class="in"><div class="dots">${c.tocchi.map(t=>`<div><b>${esc(dl(t.data))}</b> · ${rich(t.testo)}${t.perche?`<span class="n">${rich(t.perche)}</span>`:""}</div>`).join("")}</div></div></details>`).join("")}</div>`:""}<div class="sec"><span class="mono">Senza novità</span><span class="mono">${senza.length}</span></div><p class="n">${senza.map(c=>esc(c.nome)).join(" · ")}</p>`}

/* ---- Archivio ---- */
function vArchivio(){return `<p class="lead">Le edizioni passate e lo stato delle fonti.</p><div class="rows">`+D.edizioni.map(e=>`<div class="row" data-ed="${e.id}" style="cursor:pointer"><span><b>${esc(dl(e.id))}</b><span class="n">${rich(e.frase)}</span></span><span class="mono">apri</span></div>`).join("")+`</div><div class="sec"><span class="mono">Fonti</span><span class="mono">${D.fonti.ok} su ${D.fonti.totale} rispondono</span></div><details id="fo"><summary class="mono">Vedi ogni feed</summary><div class="in" id="fol">…</div></details>`}

function vai(v){V=v;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));const el=$("#v");
 el.innerHTML={oggi:vOggi,adozione:vAdozione,tesi:vTesi,clienti:vClienti,archivio:vArchivio}[v]();
 const ed=$("#ed");if(ed)ed.onchange=()=>load(ed.value);
 el.querySelectorAll("[data-ed]").forEach(r=>r.onclick=()=>load(r.dataset.ed,"oggi"));
 el.querySelectorAll("tr[data-l]").forEach(r=>r.onclick=()=>{const d=document.getElementById("lv-"+r.dataset.l);if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"start"})}});
 el.querySelectorAll("details[data-ap]").forEach(d=>d.addEventListener("toggle",()=>{if(!d.open||d.dataset.ok)return;d.dataset.ok=1;api({action:"ai_approf",id:d.dataset.ap}).then(j=>{const a=j.approf||{};document.getElementById("ap-"+d.dataset.ap).innerHTML=(a.sezioni||[]).map(s=>`<span class="k">${esc(s.titolo)}</span><p>${rich(s.testo)}</p>${grafico(s.grafico)}`).join("")+fonti(a.fonti)})}));
 const fo=$("#fo");if(fo)fo.addEventListener("toggle",()=>{if(!fo.open||fo.dataset.ok)return;fo.dataset.ok=1;api({action:"ai_fonti"}).then(j=>{$("#fol").innerHTML=`<div class="rows">${j.fonti.map(f=>`<div class="row"><span>${esc(f.nome)}<span class="n">${esc(j.gruppi[f.gruppo]||f.gruppo)} · ${f.mai?"non ancora letta":f.ok?`${f.titoli} titoli in 7 giorni`:esc((f.errori||[]).slice(-1)[0]||"non risponde")}</span></span><span class="mono" style="color:${f.mai?"var(--mut)":f.ok?"var(--up)":"var(--dn)"}">${f.mai?"·":f.ok?"ok":"no"}</span></div>`).join("")}</div>`})});
 window.scrollTo(0,0)}
function load(data,v){return api({action:"ai_get",data:data||""}).then(j=>{D=j;$("#agg").textContent=j.edizione?"edizione "+dl(j.edizione.id):"";vai(v||V)}).catch(e=>{$("#v").innerHTML=`<div class="empty">Errore: ${esc(e.message)}</div>`})}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>vai(b.dataset.v));
load();
</script></body></html>
