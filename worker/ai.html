<script>
const $=s=>document.querySelector(s),esc=s=>String(s!=null&&typeof s==="object"?(Array.isArray(s)?s.map(x=>x&&typeof x==="object"?(x.testo||x.titolo||x.nome||x.val||""):x).join(" · "):(s.testo||s.titolo||s.nome||s.val||"")):(s??"")).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const rich=s=>esc(s).replace(/\*(.+?)\*/g,"<b>$1</b>");
const NS=(t,a,x)=>`<${t} `+Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(" ")+">"+(x??"")+`</${t}>`;
const gg=d=>Math.round((new Date(d+"T12:00:00Z")-new Date(D.oggi+"T12:00:00Z"))/864e5);
const corto=(t,n)=>{t=String(t||"");if(t.length<=n)return t;const c=t.slice(0,n);return c.slice(0,c.lastIndexOf(" ")>8?c.lastIndexOf(" "):n)+"…"};
const SITO=location.pathname==="/ai"||location.pathname.startsWith("/ai/"); /* /ai = sito a sé; /ig/ia = sezione del pannello */
if(SITO){const v=document.getElementById("via");if(v){v.textContent="esci";v.href="/ai/esci"}}
function api(o){return fetch(SITO?"/ai/api":"/ig/api",{method:"POST",body:JSON.stringify(o)}).then(r=>{if(r.status===401){location.href=SITO?"/ai":"/ig/panel";throw new Error("401")}return r.text().then(t=>{try{return JSON.parse(t)}catch(e){throw new Error(`il server ha risposto ${r.status} senza dati${/<title>([^<]{0,80})/i.test(t)?" («"+t.match(/<title>([^<]{0,80})/i)[1].trim()+"»)":""}. Riprova tra poco.`)}})})}
let D=null,V="oggi";
const COL={t1:"var(--t1)",t2:"var(--t2)",t3:"var(--t3)",t4:"var(--t4)",t5:"var(--t5)",t6:"var(--t6)",t7:"var(--t7)",t8:"var(--t8)",t9:"var(--t9)"};
const tcol=id=>COL["t"+(((parseInt(String(id||"").replace(/\D/g,""))||1)-1)%9+1)];
const DIR={su:["↑","su","si rafforza"],giu:["↓","giu","si indebolisce"],stabile:["→","st","stabile"],incerta:["?","inc","da verificare"]};
const dir=d=>{const x=DIR[d]||DIR.incerta;return `<span class="dir ${x[1]}" title="${x[2]}">${x[0]}</span>`};
const dl=s=>{try{return new Date(s+"T12:00:00Z").toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"})}catch(e){return s}};
const fmt=v=>typeof v==="number"?v.toLocaleString("it-IT",{maximumFractionDigits:2}):esc(v);
const fonti=F=>(F&&F.length)?`<div class="f">Fonti: ${F.map(x=>x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.nome)}</a>`:esc(x.nome)).join(" · ")}</div>`:"";

/* ---- grafici (SVG, larghezza 680, testo grande per il telefono) ---- */
function g_barre(c){const S=c.serie||[],n=S.length;if(!n)return"";const W=680,H=250,top=72,bot=40,mx=Math.max(...S.map(s=>+s.v||0))||1,bw=Math.min(120,(W-60)/n*.62),gap=(W-40)/n;
 return `<svg viewBox="0 0 ${W} ${H}"><text x="16" y="22" fill="#7F909E" font-size="19">${esc(c.titolo||"")}</text>${S.map((s,i)=>{const h=((+s.v||0)/mx)*(H-top-bot),x=20+gap*i+(gap-bw)/2,y=H-bot-h;const col=s.prev?"none":s.evid?"#4FC3B5":"#2A4555";
 return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(2,h)}" fill="${col}" ${s.prev?'stroke="#4FC3B5" stroke-dasharray="6 5" stroke-width="2"':""}/><text x="${x+bw/2}" y="${y-9}" fill="${s.prev?"#4FC3B5":"#E8EDF2"}" font-size="21" font-weight="600" text-anchor="middle">${fmt(s.v)}</text><text x="${x+bw/2}" y="${H-12}" fill="#7F909E" font-size="18" text-anchor="middle">${esc(s.et)}</text>`}).join("")}</svg>`}
function g_orizzontali(c){const S=c.serie||[],n=S.length;if(!n)return"";const W=680,rh=40,H=46+n*rh,L=250,R=W-90,log=!!c.log,vals=S.map(s=>+s.v||0),mx=Math.max(...vals)||1,mn=Math.min(...vals.filter(v=>v>0))||1;
 const sc=v=>log?(Math.log10(v)-Math.log10(mn/2))/(Math.log10(mx)-Math.log10(mn/2)):v/mx;
 return `<svg viewBox="0 0 ${W} ${H}"><text x="16" y="22" fill="#7F909E" font-size="19">${esc(c.titolo||"")}${log?" (scala log.)":""}</text>${S.map((s,i)=>{const y=40+i*rh,w=Math.max(4,sc(+s.v||0)*(R-L));return `<text x="16" y="${y+22}" fill="#E8EDF2" font-size="19">${esc(s.et)}</text><rect x="${L}" y="${y+6}" width="${w}" height="22" fill="${s.evid?"#A796F5":"#5a4f96"}"/><text x="${L+w+8}" y="${y+24}" fill="#E8EDF2" font-size="19">${fmt(s.v)}</text>`}).join("")}</svg>`}
function g_punti(c){const S=(c.serie||[]).filter(s=>s.v!=null);if(!S.length)return"";const W=680,H=170,L=60,R=W-60,vals=S.map(s=>+s.v),mn=Math.min(...vals,...(c.forbice||[])),mx=Math.max(...vals,...(c.forbice||[])),sc=v=>L+(mx===mn?.5:(v-mn)/(mx-mn))*(R-L);
 const fb=c.forbice?`<rect x="${sc(c.forbice[0])}" y="${78}" width="${Math.max(6,sc(c.forbice[1])-sc(c.forbice[0]))}" height="18" rx="3" fill="#24323f"/><text x="${(sc(c.forbice[0])+sc(c.forbice[1]))/2}" y="68" fill="#7F909E" font-size="17" text-anchor="middle">${esc(c.forbice_et||"")}</text>`:"";
 return `<svg viewBox="0 0 ${W} ${H}"><text x="16" y="22" fill="#7F909E" font-size="19">${esc(c.titolo||"")}</text><line x1="${L}" y1="87" x2="${R}" y2="87" stroke="#1F2B35" stroke-width="2"/>${fb}${S.map((s,i)=>{const x=sc(+s.v),up=i%2;return `<circle cx="${x}" cy="87" r="${s.evid?11:9}" fill="${s.evid?"#E8A33D":"#86B4EA"}"/><text x="${x}" y="${up?60:124}" fill="${s.evid?"#E8A33D":"#E8EDF2"}" font-size="20" font-weight="600" text-anchor="middle">${fmt(s.v)}${esc(c.unita||"")}</text><text x="${x}" y="${up?40:146}" fill="#7F909E" font-size="16" text-anchor="middle">${esc(s.et)}</text>`}).join("")}</svg>`}
function g_linea(c){const S=c.serie||[];if(S.length<2)return"";const W=680,H=220,L=50,R=W-30,T=40,B=H-36,vals=S.map(s=>+s.v),mn=Math.min(...vals),mx=Math.max(...vals),X=i=>L+i/(S.length-1)*(R-L),Y=v=>B-(mx===mn?.5:(v-mn)/(mx-mn))*(B-T);
 return `<svg viewBox="0 0 ${W} ${H}"><text x="16" y="22" fill="#7F909E" font-size="19">${esc(c.titolo||"")}</text><polyline points="${S.map((s,i)=>X(i)+","+Y(+s.v)).join(" ")}" fill="none" stroke="#86B4EA" stroke-width="3"/>${S.map((s,i)=>(i===0||i===S.length-1||s.evid)?`<circle cx="${X(i)}" cy="${Y(+s.v)}" r="6" fill="${s.evid?"#E8A33D":"#86B4EA"}"/><text x="${X(i)}" y="${Y(+s.v)-12}" fill="#E8EDF2" font-size="19" text-anchor="middle">${fmt(s.v)}</text><text x="${X(i)}" y="${H-8}" fill="#7F909E" font-size="16" text-anchor="middle">${esc(s.et)}</text>`:"").join("")}</svg>`}
function grafico(c){if(!c)return"";const f={barre:g_barre,orizzontali:g_orizzontali,punti:g_punti,linea:g_linea}[c.tipo];return f?`<div class="chart">${f(c)}${c.nota?`<div class="cap">${rich(c.nota)}</div>`:""}</div>`:""}
/* rete: nodi in cerchio, archi con etichetta (dipendenze di Oggi, intrecci dell'Adozione) */
function rete(N,A,nota){if(!N||!N.length)return"";const n=N.length,W=680,H=n<=4?300:Math.max(460,110+n*52),cx=W/2,cy=H/2,rx=W/2-110,ry=H/2-40,P={};
 N.forEach((x,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;P[x.id]=[cx+rx*Math.cos(a),cy+ry*Math.sin(a)]});
 const tr=(x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,k=Math.min(.45,26/Math.abs(dy/L||1e-6)/L,70/L);return [x1+dx*k,y1+dy*k,x2-dx*k,y2-dy*k]};
 const arc=(A||[]).filter(a=>P[a.da]&&P[a.a]).map(a=>{const[x1,y1,x2,y2]=tr(...P[a.da],...P[a.a]),mx=(x1+x2)/2,my=(y1+y2)/2;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${a.forte?"#E8A33D":"#3a4a58"}" stroke-width="${a.forte?3.5:2}" marker-end="url(#${a.forte?"fo":"fr"})"/>${a.testo&&(a.forte||n<=4)?`<text x="${mx}" y="${my-8}" fill="${a.forte?"#E8A33D":"#7F909E"}" font-size="17" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#0B1118" stroke-width="5">${esc(a.testo)}</text>`:""}`}).join("");
 const nod=N.map(x=>{const[px,py]=P[x.id],w=Math.max(120,String(x.nome).length*11+28);return `<rect x="${px-w/2}" y="${py-22}" width="${w}" height="44" rx="6" fill="#16202a" stroke="${x.evid?"#4FC3B5":"#2f4050"}"/><text x="${px}" y="${py+6}" fill="#E8EDF2" font-size="18" font-weight="600" text-anchor="middle">${esc(x.nome)}</text>`}).join("");
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}"><defs><marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3a4a58"/></marker><marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E8A33D"/></marker></defs>${arc}${nod}</svg>${nota?`<div class="cap">${rich(nota)}</div>`:""}</div>`}

/* ---- Oggi ---- */
function calendario(O){const F=(O||[]).filter(o=>o.data&&/^\d{4}-\d{2}-\d{2}$/.test(o.data)&&gg(o.data)>=0).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,4);if(!F.length)return"";
 const W=358,x0=10,x1=W-40,mx=Math.max(...F.map(o=>gg(o.data)),1);let s=NS("line",{x1:x0,y1:30,x2:W-8,y2:30,stroke:"#1F2B35","stroke-width":2})+NS("circle",{cx:x0,cy:30,r:4,fill:"#E8EDF2"})+NS("text",{x:x0-8,y:16,fill:"#7F909E","font-size":10,"font-family":"monospace"},"OGGI");
 let last=-99;F.forEach((o,i)=>{const d=gg(o.data);let x=Math.max(x0+44,x0+(x1-x0)*Math.sqrt(d/mx));if(x-last<84)x=last+84;x=Math.min(x,W-40);last=x;const c=i===0?"#E8A33D":"#86B4EA",dt=new Date(o.data+"T12:00:00Z").toLocaleDateString("it-IT",{day:"numeric",month:"short"}).toUpperCase(),w=corto(o.testo,34).split(" "),l1=[],l2=[];w.forEach(p=>((l1.join(" ")+" "+p).length<17&&!l2.length?l1:l2).push(p));
  s+=NS("circle",{cx:x,cy:30,r:i===0?7:5,fill:c})+NS("text",{x,y:16,fill:c,"font-size":10,"text-anchor":"middle","font-family":"monospace"},dt)+NS("text",{x,y:52,fill:"#E8EDF2","font-size":11,"text-anchor":"middle"},d===0?"oggi":d===1?"domani":`tra ${d} gg`)+NS("text",{x,y:67,fill:"#7F909E","font-size":10,"text-anchor":"middle"},esc(l1.join(" ")))+NS("text",{x,y:80,fill:"#7F909E","font-size":10,"text-anchor":"middle"},esc(corto(l2.join(" "),18)))});
 return `<svg viewBox="0 0 ${W} 92" style="width:100%;display:block">${s}</svg>`}
const EFF={su:["▲","rafforza","var(--up)"],giu:["▼","indebolisce","var(--dn)"],stabile:["●","conferma","var(--mut)"],incerta:["◆","incerto","var(--mut)"]};
/* ---- Adozione: livelli × orizzonti ---- */
const OR=[["breve","0–12 mesi"],["medio","1–3 anni"],["lungo","3–10 anni"]];
const DCOL={su:"#4CC9A6",giu:"#F0A04B",stabile:"#7F909E",incerta:"#E8A33D"},CONF={alta:1,media:.66,bassa:.33};
const STADI=[["esplora","esplora"],["pilota","pilota"],["produzione","in produzione"],["scala","in scala"]];

function cella(x){if(!x)return `<td><span class="c">—</span></td>`;const c=DCOL[x.direzione]||DCOL.incerta,w=Math.round((CONF[x.confidenza]||.5)*100);

 if(!K.length)return `<p class="n">Nessun caso dichiara il modello usato (${C.length} casi).</p>`;
