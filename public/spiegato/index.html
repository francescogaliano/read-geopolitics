<style>
/* Spiegato di Read Geopolitics: modello unico. Il contenuto arriva da /spiegato/<id>.json (formato in fondo al file). */
:root{color-scheme:dark;--bg:#0B1830;--fg:#EEF2F6;--mut:#9FB0C2;--line:#22324D;--gold:#E8B050;--blue:#86B4EA;--red:#e5786d;--green:#7FD1A0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:17px/1.6 "IBM Plex Sans",system-ui,sans-serif;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

@media (min-width:980px){
 .scrolly{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0 40px;max-width:1180px;margin:8px auto 0;padding:0 24px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){

/* condividi: menu del telefono se c'è, altrimenti copia il link */

document.getElementById("spBack").addEventListener("click",function(ev){try{var r=document.referrer&&new URL(document.referrer);if(r&&r.origin===location.origin&&history.length>1){ev.preventDefault();history.back()}}catch(_){}});
document.addEventListener("click",function(ev){var a=ev.target.closest(".ent");var sh=document.getElementById("sheet");
 if(a){ev.preventDefault();var d=SP.ent[a.dataset.e];if(!d)return;document.getElementById("shk").textContent=d.tipo||"";document.getElementById("sht").textContent=d.nome||"";document.getElementById("shp").textContent=d.testo||"";var g=document.getElementById("shg");g.firstChild.textContent=(d.go||"Apri")+" ";g.href=a.getAttribute("href");sh.classList.add("on");return}
 if(ev.target.closest("#shx")||(!ev.target.closest("#sheet")&&sh.classList.contains("on")))sh.classList.remove("on")});

function page(){var s=SP,h="";
 h+='<div class="wrap"><div class="crumb mono"><a href="/#spiegati">Spiegati</a>'+(s.tema?' › <a class="ent" data-e="tema" href="/#t='+e(s.tema)+'">'+e(s.tema_nome||"Tema")+'</a>':'')+'</div>';
 h+='<div class="mono kick">'+e(s.kicker||"Spiegato")+'</div><h1>'+e(s.titolo).replace(/\*([^*]+)\*/g,"<em>$1</em>")+'</h1><p class="dek">'+rich(s.dek)+'</p>';
 h+='<div class="meta mono"><span>Spiegato al '+dl(s.data,true)+'</span><span>'+s.min+' minuti</span><span>'+(s.fonti||[]).length+' fonti</span>'+(s.fiducia?'<span>Fiducia: '+e(s.fiducia)+'</span>':'')+'<button type="button" class="shr" data-share="1">↗ Condividi</button></div></div>';
 h+='<section class="scrolly"><div class="stage" id="stage"><svg id="map" role="img" aria-label="'+e(s.map_alt||"Mappa del racconto")+'"></svg><div class="prog" id="prog">'+s.steps.map(function(){return "<i></i>"}).join("")+'</div><div class="cap mono" id="cap"></div><div class="cnt" id="cnt"><b id="cntb"></b><span class="mono" id="cnts"></span></div><div class="note" id="note"></div></div><div class="steps">';

 if(s.osservare&&s.osservare.length)h+='<section class="blk"><h2>Da osservare</h2>'+s.osservare.map(function(o){return '<div class="w"><span>'+rich(o.t)+'</span><i>'+e(o.q)+'</i></div>'}).join("")+'</section>';
 h+='<section class="blk next"><button type="button" class="shr-row" data-share="1">↗ Condividi questo Spiegato <span>link ›</span></button>'+(s.tema?'<a href="/#t='+e(s.tema)+'">'+e(s.tema_nome||"Il tema")+' <span>storie ›</span></a>':'')+(s.altri||[]).map(function(a){return '<a href="'+e(a.href)+'">'+e(a.t)+' <span>'+e(a.k||"")+' ›</span></a>'}).join("")+'<a href="/#spiegati">Altri Spiegati <span>›</span></a></section>';
 h+='<details class="more src"><summary>'+(s.fonti||[]).length+' fonti <span>›</span></summary><ol class="src-l">'+(s.fonti||[]).map(function(f){return '<li><a href="'+e(f.url)+'" target="_blank" rel="noopener">'+e(f.nome)+'</a>'+(f.nota?(/^\(/.test(f.nota)?' ':', ')+e(f.nota):'')+'</li>'}).join("")+'</ol><p class="end">'+e(s.nota_mappa||"Mappa schematica; percorsi indicativi.")+'</p></details></div>';

}

/* Da allora: storie del tema dopo la data dello Spiegato */
function after(){var box=document.getElementById("aft");if(!box)return;
 function show(st){var L=st.filter(function(x){return x.data&&x.data.filone_id===SP.tema&&String(x.data.data||"")>SP.data}).map(function(x){return {id:x.id,t:x.data.titolo,d:x.data.data}});
  var seen={};L=L.filter(function(x){if(seen[x.id])return false;seen[x.id]=1;return true}).sort(function(a,b){return a.d<b.d?1:-1}).slice(0,6);
  box.innerHTML=L.length?L.map(function(x){return '<a class="w" href="/#s='+e(x.id)+'"><span>'+e(x.t)+'</span><i>'+dl(x.d)+'</i></a>'}).join(""):'<div class="w none"><span>Ancora nessuno sviluppo dopo il '+dl(SP.data)+'.</span></div>'}
 if(!SP.tema){box.innerHTML="";return}
 fetch(RG_API+"/api/data.json?parte=oggi").then(function(r){return r.json()}).then(function(j){show((j.collections&&j.collections.stories)||[])}).catch(function(){box.innerHTML='<div class="w none"><span>Gli sviluppi non sono raggiungibili ora.</span></div>'})}

/* ---------- mappa ---------- */
var NS="http://www.w3.org/2000/svg",svg,W=0,H=0,proj=d3.geoMercator(),path=d3.geoPath(proj);
var cur=null,S=-1,ts=0,t0=performance.now(),feats=[],countries=[],lay={},M={},cntAnim=null;

function lerpV(a,b,t){return [[a[0][0]+(b[0][0]-a[0][0])*t,a[0][1]+(b[0][1]-a[0][1])*t],[a[1][0]+(b[1][0]-a[1][0])*t,a[1][1]+(b[1][1]-a[1][1])*t]]}
function txt(s,fill,size,g){var x=el("text",{"font-family":"IBM Plex Mono, monospace","font-size":size||"12","font-weight":"500","letter-spacing":"1.5",fill:fill||COL.white,opacity:"0","paint-order":"stroke",stroke:"#0B1830","stroke-width":"4"},g||lay.gLab);x.textContent=s;return x}
var LINE={river:{stroke:COL.water,w:3.5},flood:{stroke:COL.water,w:16,op:.35},front:{stroke:COL.red,w:4,dash:"10 6",flow:1},route:{stroke:COL.gold,w:3},road:{stroke:COL.grey,w:2.5,dash:"6 6"},border:{stroke:COL.red,w:2,dash:"4 4"},sea:{stroke:COL.blue,w:2.5,dash:"2 6"}};
function build(){
 svg.innerHTML="";var gLand=el("g",{}),gLow=el("g",{}),gLines=el("g",{}),gPts=el("g",{});lay={};lay.gLab=el("g",{});var F=M.focus||[];
 countries=feats.map(function(f){return {f:f,e:el("path",{fill:F.indexOf(f.id)>=0?"#1E3760":"#132544",stroke:"#2C4670","stroke-width":"1"},gLand)}});
 Object.keys(M.lines||{}).forEach(function(k){var d=M.lines[k],st=LINE[d.kind]||LINE.route;
