name: Dati per il mockup (solo lettura)
on:
  push:
    branches: [mockup-dati]
    paths: [".github/workflows/dati-mockup.yml"]
permissions:
  contents: write
jobs:
  dati:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p mockup-dati
          curl -sf "https://rg-api.briefinghub.workers.dev/api/data.json" -o mockup-dati/data.json
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add mockup-dati && git commit -m "dati per il mockup" && git push
