# TEMPORANEO (23/11/2026, autorizzato da Francesco): scarica i dati pubblici di ai.readgeopolitics.com per la storia Instagram. Da cancellare con il ramo.
name: tmp cattura IA
on:
  push:
    branches: [tmp-cattura-ia]
    paths: [".github/workflows/tmp-cattura-ia.yml"]
permissions:
  contents: write
jobs:
  cattura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-dati
          curl -s -X POST https://ai.readgeopolitics.com/api -d '{"action":"ai_get","data":""}' -o tmp-dati/ai_get.json
          python3 -c "import json;d=json.load(open('tmp-dati/ai_get.json'));assert d.get('privato') is False and not d.get('clienti'),'contiene dati privati';print('ok pubblico',len(open('tmp-dati/ai_get.json').read()))"
          git config user.name "tmp-cattura"; git config user.email "tmp@localhost"
          git add tmp-dati/ai_get.json && git commit -m "TEMPORANEO: dati pubblici del sito IA" && git push
