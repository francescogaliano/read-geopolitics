# TEMPORANEO (23/11/2026, autorizzato da Francesco): dati pubblici e loghi pubblici per la storia Instagram del sito AI. Da cancellare con il ramo.
name: tmp cattura IA
on:
  push:
    branches: [tmp-cattura-ia]
    paths: [".github/workflows/tmp-cattura-ia.yml"]
permissions:
  contents: write
jobs:
  cattura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-dati/loghi
          while read d; do [ -n "$d" ] && curl -s -L "https://www.google.com/s2/favicons?domain=$d&sz=128" -o "tmp-dati/loghi/$d.png"; done < tmp-dati/loghi.txt
          ls tmp-dati/loghi | wc -l
          git config user.name "tmp-cattura"; git config user.email "tmp@localhost"
          git add tmp-dati/loghi && git commit -m "TEMPORANEO: loghi pubblici per la storia" && git push
